<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apprentice Flash Cards</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#facc15; --text:#f1f5f9; --muted:#94a3b8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:1.2rem; margin:8px 0 4px; color:var(--accent); }
  .progress { color:var(--muted); font-size:.9rem; margin-bottom:12px; }
  .bar { width:100%; max-width:520px; height:6px; background:#334155; border-radius:3px; overflow:hidden; margin-bottom:16px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .scene { width:100%; max-width:520px; height:360px; perspective:1000px; }
  .card { position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .5s; cursor:pointer; }
  .card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; background:var(--card); border:2px solid #334155; border-radius:16px; padding:24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; overflow:auto; }
  .face.back { transform:rotateY(180deg); border-color:var(--accent); }
  .label { position:absolute; top:12px; left:16px; font-size:.75rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  .text { font-size:1.3rem; line-height:1.5; white-space:pre-line; }
  .hint { position:absolute; bottom:10px; font-size:.75rem; color:var(--muted); }
  .controls { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; justify-content:center; }
  button { background:var(--card); color:var(--text); border:2px solid #334155; border-radius:10px; padding:12px 18px; font-size:1rem; cursor:pointer; }
  button:active { background:#334155; }
  button.primary { background:var(--accent); color:#111827; border-color:var(--accent); font-weight:600; }
  button.on { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<h1>Apprentice Flash Cards</h1>
<div class="progress" id="progress"></div>
<div class="bar"><div id="fill"></div></div>

<div class="scene">
  <div class="card" id="card">
    <div class="face front"><span class="label" id="qlabel">Question</span><div class="text" id="q"></div><span class="hint">Tap to flip</span></div>
    <div class="face back"><span class="label">Answer</span><div class="text" id="a"></div><span class="hint">Tap to flip</span></div>
  </div>
</div>

<div class="controls">
  <button id="prev">&larr; Prev</button>
  <button id="next" class="primary">Next &rarr;</button>
  <button id="shuffle">Shuffle</button>
  <button id="reset">Reset order</button>
</div>

<script>
const CARDS = [
  { n: 1, q: `Points of contact on a ladder?`, a: `3 points of contact` },
  { n: 2, q: `First president of the IBEW and present?`, a: `Henry Miller and Lonnie Stephenson` },
  { n: 3, q: `Probation hours an apprentice?`, a: `1750` },
  { n: 4, q: `Minimum Gaff length?`, a: `1 ¼"` },
  { n: 5, q: `Are employers required to provide FR2?`, a: `No` },
  { n: 6, q: `I in OHMS law?`, a: `Current` },
  { n: 7, q: `E in Ohms law?`, a: `Voltage` },
  { n: 8, q: `Show the formula?`, a: `I= E/R\nE= IxR\nR= E/I` },
  { n: 9, q: `Fall restraint anchor attachment should be rated at?`, a: `5000 lbs` },
  { n: 10, q: `Minimum height for ground for fall restraight?`, a: `4 Feet` },
  { n: 11, q: `When should you start slowing when approaching a hill in a truck?`, a: `Before the hill` },
  { n: 12, q: `Humans error is the main cause of break failure?`, a: `True` },
  { n: 13, q: `IBEW stands for?`, a: `International Brotherhood of Electrical Workers` },
  { n: 14, q: `JATC stands for?`, a: `Joint Apprenticeship Training Committee` },
  { n: 15, q: `NECA stands for?`, a: `National Electrical Contractors Association` },
  { n: 16, q: `An apprentice can be removed from the program during his probation period?`, a: `True` },
  { n: 17, q: `Kilo is 10³ or?`, a: `1000 (One thousand)` },
  { n: 18, q: `10,000,000 is also?`, a: `10mw` },
  { n: 19, q: `Pole top rescue should be practiced?`, a: `Once a year` },
  { n: 20, q: `It is considered low voltage at?`, a: `600v` },
  { n: 21, q: `Class E hardhats are tested at?`, a: `20,000 v` },
  { n: 22, q: `The ANSI rating of glasses should be?`, a: `Z87.1` },
  { n: 23, q: `A class 3 pole is bigger than a class 1 pole?`, a: `False` },
  { n: 24, q: `The minimum size for a ground cable is?`, a: `#2` },
  { n: 25, q: `The severity of an electrical shock is affected by?`, a: `Path of current, amount of current, and amount of time.` },
  { n: 26, q: `Before entering vault you should?\n*CIRCLE ALL*`, a: `A. heat cable\nB. Check for hazards\nC. Air monitor\nD. Make sure there is rescue equipment` },
  { n: 27, q: `Three type of cave in prevention?`, a: `1. Stepping 2. Slopping 3. Shorting` },
  { n: 28, q: `Two main uses for hand line are sending up light material, and Pole top rescue?`, a: `True` },
  { n: 29, q: `Safe hand line use includes?`, a: `A. Keeping line away from traffic\nB. Not tying hand line to truck\nC. Using break away hook when climbing\nD. All of the above` },
  { n: 30, q: `Crane operating; arm extended, thumb down and opening and closing fingers?`, a: `Boom down and raise the load.` },
  { n: 31, q: `Crane operator; One hand, thumb out and pointing towards chest?`, a: `Extend telescoping boom` },
  { n: 32, q: `Crane operation: touch hand to elbow?`, a: `Axillary hoist` },
  { n: 33, q: `In the SI metric system "meter" is used to describe?`, a: `Length` },
  { n: 34, q: `How deep do you set a 75 foot pole?`, a: `9.5 feet (10% plus 2 inches)` },
  { n: 35, q: `A knot in a rope reduces its strength by?`, a: `45 to 55%` },
  { n: 36, q: `¼ x ¼ ?`, a: `1/16 = 16 divided by 1.00 = .0625` },
  { n: 37, q: `4 ¼ divided 8 1/8? 17/4 divided 65/8= 17/1 x 2/65=`, a: `65 divided 34 = .52307` },
  { n: 38, q: `¾ divided 1/8? (¾ x 8/1 = 24/4 = 4 divided 24 =)`, a: `6` },
  { n: 39, q: `5² + 3.2²? (25+ 10.24=)`, a: `35.24` },
  { n: 40, q: `((24x24) +7)? (576+7 =)`, a: `583` },
  { n: 41, q: `WLL = 7,000\nSF = 5:1\nBreaking point?`, a: `35,000` },
  { n: 42, q: `WLL =? ( 15,000 divided by 5= 3,000)\nSF= 5:1\nBreaking point= 15,000`, a: `3,000` },
  { n: 43, q: `Convert to decimal 13%? (Move the decimal to the left two places then put period)`, a: `.0013` },
  { n: 44, q: `Convert to percent .476? (Move the decimal to the right two places)`, a: `47.6 %` }
];

let deck = CARDS.slice();
let i = 0;
const $ = id => document.getElementById(id);
const card = $('card');

function render() {
  const c = deck[i];
  card.classList.remove('flipped');
  setTimeout(() => {
    $('q').textContent = c.q;
    $('a').textContent = c.a;
    $('qlabel').textContent = 'Question ' + c.n;
  }, 120);
  $('progress').textContent = (i + 1) + ' / ' + deck.length;
  $('fill').style.width = ((i + 1) / deck.length * 100) + '%';
}
function go(d) { i = (i + d + deck.length) % deck.length; render(); }
function shuffle() {
  for (let k = deck.length - 1; k > 0; k--) {
    const j = Math.floor(Math.random() * (k + 1));
    [deck[k], deck[j]] = [deck[j], deck[k]];
  }
  i = 0; render();
}

card.onclick = () => card.classList.toggle('flipped');
$('next').onclick = () => go(1);
$('prev').onclick = () => go(-1);
$('shuffle').onclick = shuffle;
$('reset').onclick = () => { deck = CARDS.slice(); i = 0; render(); };
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); card.classList.toggle('flipped'); }
});

render();
</script>
</body>
</html>
